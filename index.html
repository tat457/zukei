<!-- 変更箇所だけでなく完全版 -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>牛囲いゲーム</title>
<style>
html, body {margin:0;height:100%;overflow:hidden;background:#88cc66;font-family:sans-serif;}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#c9f7a5;}
select,button{padding:12px;font-size:16px;margin:6px;border-radius:10px;border:none;}
button{background:#2f7d32;color:#fff;}
#game{display:none;}
#ui{position:fixed;top:10px;left:10px;background:#fff;padding:8px;border-radius:8px;display:none;}
</style>
</head>
<body>

<div id="menu">
<h1>牛囲いゲーム</h1>

<select id="shapeSelect">
<option value="円">円</option>
<option value="三角形">三角形</option>
<option value="四角形">四角形</option>
<option value="台形">台形</option>
<option value="五角形">五角形</option>
<option value="正方形">正方形</option>
<option value="長方形">長方形</option>
<option value="二等辺三角形">二等辺三角形</option>
<option value="正三角形">正三角形</option>
</select>

<select id="difficulty">
<option value="やさしめ">やさしめ</option>
<option value="ふつう">ふつう</option>
<option value="むずかしい">むずかしい</option>
</select>

<button id="startBtn">スタート</button>
</div>

<div id="ui">図形: <span id="currentShape"></span></div>

<canvas id="game"></canvas>
<audio id="bgm" src="bocjou.mp3" loop></audio>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let cows=[],path=[],fence=null,drawing=false;
let selectedShape="",difficulty="やさしめ";

// ===== スタート =====
document.getElementById("startBtn").onclick=()=>{
 selectedShape=document.getElementById("shapeSelect").value;
 difficulty=document.getElementById("difficulty").value;

 document.getElementById("menu").style.display="none";
 document.getElementById("ui").style.display="block";
 document.getElementById("currentShape").innerText=selectedShape;

 canvas.style.display="block";
 canvas.width=innerWidth;
 canvas.height=innerHeight;

 initCows();

 document.getElementById("bgm").play().catch(()=>{});
 loop();
};

// ===== 牛設定 =====
function initCows(){
 let speed=1.8;
 let count=3;

 if(difficulty==="ふつう") speed=2.8;
 if(difficulty==="むずかしい"){speed=2.8;count=4;}

 cows=[];
 for(let i=0;i<count;i++){
  cows.push({
   x:Math.random()*innerWidth,
   y:Math.random()*innerHeight,
   vx:(Math.random()-0.5)*speed,
   vy:(Math.random()-0.5)*speed,
   radius:18
  });
 }
}

// ===== ループ =====
function loop(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle="#88cc66";ctx.fillRect(0,0,canvas.width,canvas.height);

 if(fence) drawFence();
 if(path.length>1) drawPath();

 cows.forEach(c=>{
  move(c);
  drawCow(c);
 });

 requestAnimationFrame(loop);
}

// ===== 牛 =====
function move(c){
 c.x+=c.vx;c.y+=c.vy;

 if(c.x<0||c.x>canvas.width)c.vx*=-1;
 if(c.y<0||c.y>canvas.height)c.vy*=-1;

 reflect(c,path);
 reflect(c,fence,true);
}

function reflect(c,line,closed=false){
 if(!line||line.length<2)return;
 for(let i=0;i<line.length-1;i++){
  if(hit(c,line[i],line[i+1]))return;
 }
 if(closed) hit(c,line[line.length-1],line[0]);
}

function hit(c,a,b){
 let t=((c.x-a.x)*(b.x-a.x)+(c.y-a.y)*(b.y-a.y))/((b.x-a.x)**2+(b.y-a.y)**2||1);
 t=Math.max(0,Math.min(1,t));
 let x=a.x+(b.x-a.x)*t,y=a.y+(b.y-a.y)*t;
 let dx=c.x-x,dy=c.y-y,d=Math.hypot(dx,dy);
 if(d<c.radius){
  let nx=dx/(d||1),ny=dy/(d||1);
  let dot=c.vx*nx+c.vy*ny;
  c.vx-=2*dot*nx;c.vy-=2*dot*ny;
  return true;
 }
 return false;
}

function drawCow(c){
  ctx.save();
  ctx.translate(c.x,c.y);
  ctx.rotate(c.angle);
 
  ctx.fillStyle="#6b4a32";
  ctx.beginPath();
  ctx.ellipse(0,0,24,15,0,0,Math.PI*2);
  ctx.fill();
  
  ctx.fillStyle="#5a3d2b";
  ctx.beginPath();
  ctx.ellipse(25,0,10,8,0,0,Math.PI*2);
  ctx.fill();
 
  ctx.restore();
}

// ===== 描画 =====
function drawPath(){
 ctx.strokeStyle="black";
 ctx.beginPath();
 ctx.moveTo(path[0].x,path[0].y);
 path.forEach(p=>ctx.lineTo(p.x,p.y));
 ctx.stroke();
}

function drawFence(){
 ctx.strokeStyle="brown";
 ctx.beginPath();
 ctx.moveTo(fence[0].x,fence[0].y);
 fence.forEach(p=>ctx.lineTo(p.x,p.y));
 ctx.closePath();
 ctx.stroke();
}

// ===== 入力 =====
canvas.onpointerdown=e=>{drawing=true;path=[pos(e)];};
canvas.onpointermove=e=>{if(drawing)path.push(pos(e));};
canvas.onpointerup=endDraw;

function pos(e){return{x:e.clientX,y:e.clientY};}

// ===== 判定 =====
function endDraw(){
 drawing=false;
 if(path.length<10)return;

 if(!checkShape(path,selectedShape)){
  alert("図形が違います");
  return;
 }

 fence=path;

 if(cows.every(c=>inside(c,fence))){
  alert("クリア！");
 }
}

// ===== 図形判定（強化版）=====
function checkShape(p,s){
 let poly=simplify(p);

 if(s==="円") return isCircle(p);
 if(s==="三角形") return poly.length===3;
 if(s==="五角形") return poly.length===5;

 if(s==="正三角形"){
  return poly.length===3 && equalSides(poly,1.2);
 }

 if(s==="二等辺三角形"){
  return poly.length===3 && twoEqualSides(poly,1.3);
 }

 if(s==="正方形"){
  return poly.length===4 && equalSides(poly,1.2) && rightAngles(poly);
 }

 if(s==="長方形"){
  return poly.length===4 && rightAngles(poly);
 }

 if(s==="四角形"){
  return poly.length===4;
 }

 if(s==="台形"){
  return poly.length===4 && hasParallel(poly);
 }

 return false;
}

// ===== 補助 =====
function isCircle(p){
 let cx=p.reduce((a,b)=>a+b.x,0)/p.length;
 let cy=p.reduce((a,b)=>a+b.y,0)/p.length;
 let rs=p.map(v=>Math.hypot(v.x-cx,v.y-cy));
 let avg=rs.reduce((a,b)=>a+b)/rs.length;
 let err=rs.reduce((a,b)=>a+(b-avg)**2,0)/rs.length;
 return err<300;
}

function simplify(p){
 return p.filter((_,i)=>i%Math.floor(p.length/6)==0);
}

function sides(poly){
 let arr=[];
 for(let i=0;i<poly.length;i++){
  let a=poly[i],b=poly[(i+1)%poly.length];
  arr.push(Math.hypot(b.x-a.x,b.y-a.y));
 }
 return arr;
}

function equalSides(poly,tol){
 let s=sides(poly);
 return Math.max(...s)/Math.min(...s)<tol;
}

function twoEqualSides(poly,tol){
 let s=sides(poly);
 for(let i=0;i<s.length;i++){
  for(let j=i+1;j<s.length;j++){
   if(Math.max(s[i],s[j])/Math.min(s[i],s[j])<tol) return true;
  }
 }
 return false;
}

function rightAngles(poly){
 for(let i=0;i<poly.length;i++){
  let a=poly[(i-1+poly.length)%poly.length];
  let b=poly[i];
  let c=poly[(i+1)%poly.length];
  let ab=[a.x-b.x,a.y-b.y];
  let cb=[c.x-b.x,c.y-b.y];
  let dot=ab[0]*cb[0]+ab[1]*cb[1];
  let ang=Math.acos(dot/(Math.hypot(...ab)*Math.hypot(...cb)))*180/Math.PI;
  if(Math.abs(ang-90)>25)return false;
 }
 return true;
}

function hasParallel(poly){
 function ang(a,b){return Math.atan2(b.y-a.y,b.x-a.x);}
 let a1=ang(poly[0],poly[1]);
 let a2=ang(poly[2],poly[3]);
 return Math.abs(a1-a2)<0.3;
}

function inside(p,vs){
 let inside=false;
 for(let i=0,j=vs.length-1;i<vs.length;j=i++){
  let xi=vs[i].x,yi=vs[i].y;
  let xj=vs[j].x,yj=vs[j].y;
  let inter=((yi>p.y)!=(yj>p.y))&&(p.x<(xj-xi)*(p.y-yi)/(yj-yi)+xi);
  if(inter) inside=!inside;
 }
 return inside;
}
</script>
</body>
</html>
